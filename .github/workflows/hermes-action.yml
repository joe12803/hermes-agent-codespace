name: Run Hermes Agent & WebUI

on:
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Hermes Agent Repository
        run: git clone --depth 1 https://github.com/NousResearch/hermes-agent.git /tmp/hermes

      - name: Install uv (Python Package Manager)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install Hermes Dependencies
        working-directory: /tmp/hermes
        run: |
          uv venv .venv
          uv pip install -e ".[all]"

      - name: Configure API and Feishu Environment
        run: |
          mkdir -p /tmp/data
          
          # 1. 写入配置文件，强制使用自定义模型和覆盖默认模型
          cat << 'CONFEOF' > /tmp/data/config.yaml
model:
  provider: custom
  default: openai/gemini-3-flash
CONFEOF

          # 2. 写入所有的环境变量
          cat << 'ENVEOF' > /tmp/data/.env
OPENAI_BASE_URL=https://openclaw.994938.xyz/v1
OPENAI_API_KEY=sk-KhbSk9pyLHkw8AzPy
LLM_MODEL=openai/gemini-3-flash
FEISHU_APP_ID=cli_a936f831e0389bc0
FEISHU_APP_SECRET=05o9tqccFrNsPQ5EtnlaL3aphGNVCzPF
TELEGRAM_BOT_TOKEN=8663293275:AAHOsfeSCs38BxbCxpJjQOVO_MHXqSQtJiU
TELEGRAM_ALLOWED_USERS=5145338625
TELEGRAM_HOME_CHANNEL=5145338625
TELEGRAM_HOME_CHANNEL_NAME=Admin
ENVEOF

      - name: Install Cloudflared Tunnel
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Start WebUI & Expose Tunnel URL
        working-directory: /tmp/hermes
        run: |
          export PATH="/tmp/hermes/.venv/bin:$PATH"
          export HERMES_HOME=/tmp/data
          
          nohup hermes dashboard --host 0.0.0.0 --port 9119 --insecure > dashboard.log 2>&1 &
          nohup cloudflared tunnel --url http://127.0.0.1:9119 > cloudflared.log 2>&1 &
          
          echo "Waiting for Cloudflare Tunnel URL..."
          for i in {1..20}; do
            URL=$(grep -oE "https://[a-zA-Z0-9-]+\.trycloudflare\.com" cloudflared.log | tail -1)
            if [ -n "$URL" ]; then
              echo "======================================================="
              echo "🚀 Hermes Agent WebUI is Live!"
              echo "🌐 点击此链接访问: $URL"
              echo "======================================================="
              break
            fi
            sleep 2
          done

      - name: Start Gateway (Keep Action Alive)
        working-directory: /tmp/hermes
        run: |
          export PATH="/tmp/hermes/.venv/bin:$PATH"
          export HERMES_HOME=/tmp/data
          
          echo "正在安装网关扩展包..."
          hermes gateway install || true
          
          echo "正在前台启动 Hermes Gateway 并输出日志..."
          export LOG_LEVEL=DEBUG
          nohup hermes gateway start > gateway.log 2>&1 &
          tail -f gateway.log || sleep 21600
